<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koleksiyon — Aurel Valmont</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Cocogoose';
  src: url('fonts/cocogoose.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'DINNext';
  src: url('fonts/din-next.otf') format('opentype');
  font-weight: normal;
  font-style: normal;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#0a0a0a;
  --white:#fff;
  --gray-bg:#f9f9f9;
  --gray-mid:#999;
  --gray-border:#e0e0e0;
  --sans:'Montserrat',sans-serif;
  --serif:'Cormorant Garamond',serif;
}
body{font-family:var(--sans);color:var(--black);background:#f9f9f9;overflow-x:hidden}

/* NAV */
nav{
  position:sticky;top:0;z-index:100;
  background:var(--white);
  border-bottom:1px solid var(--gray-border);
  height:56px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:0 24px;
}
.nav-left{display:flex;align-items:center;gap:0}
.nav-hamburger{background:none;border:none;cursor:pointer;padding:4px;display:flex;flex-direction:column;gap:5px}
.nav-hamburger span{display:block;width:20px;height:1px;background:var(--black)}
.nav-logo{display:flex;align-items:center;text-decoration:none;color:var(--black)}
.nav-brand{font-family:'Cocogoose',sans-serif;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--black);margin-left:12px;opacity:1;max-width:200px;overflow:hidden;white-space:nowrap;transition:opacity 0.6s ease,max-width 0.6s ease,margin 0.6s ease}
nav.scrolled .nav-brand{opacity:0;max-width:0;margin-left:0}
.nav-right{display:flex;align-items:center;justify-content:flex-end;gap:20px}
.nav-icon{background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center;color:var(--black);transition:opacity .2s}
.nav-icon:hover{opacity:.5}
.nav-menu{display:flex;align-items:center;gap:8px;font-family:'Cocogoose',sans-serif;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--black);text-decoration:none;cursor:pointer;background:none;border:none;transition:opacity .2s}
.nav-menu:hover{opacity:.6}

/* TOOLBAR */
.toolbar{
  position:sticky;top:56px;z-index:99;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;
  height:48px;
  background:var(--white);
  border-bottom:1px solid var(--gray-border);
}
.toolbar-left{display:flex;align-items:center;gap:0;height:100%}
.toolbar-cat{
  font-size:9px;font-weight:normal;letter-spacing:.2em;
  color:var(--gray-mid);text-decoration:none;border:none;
  background:none;cursor:pointer;font-family:'Cocogoose',sans-serif;
  text-transform:uppercase;padding:0 20px;height:100%;
  display:flex;align-items:center;
  border-bottom:2px solid transparent;
  transition:color .25s,border-color .25s;
  position:relative;
}
.toolbar-cat:first-child{padding-left:0}
.toolbar-cat:hover{color:var(--black)}
.toolbar-cat.active{color:var(--black);border-bottom-color:var(--black)}
.cat-label{display:none}
.toolbar-right{display:flex;align-items:center;gap:20px}
.sort-btn{font-size:10px;font-weight:normal;background:none;border:none;cursor:pointer;font-family:'Cocogoose',sans-serif;color:var(--black);display:flex;align-items:center;gap:4px;letter-spacing:.15em;text-transform:uppercase}
.sort-btn:hover{opacity:.6}
.refine-btn{font-size:10px;font-weight:normal;background:none;border:none;cursor:pointer;font-family:'Cocogoose',sans-serif;color:var(--black);letter-spacing:.15em;text-transform:uppercase}
.refine-btn:hover{opacity:.6}
.toolbar-sep{width:1px;height:14px;background:var(--gray-border)}

/* GRID */
.product-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  column-gap:14px;
  row-gap:0;
  background:#f9f9f9;
  padding:0 20px;
}
.product-card{
  background:#f9f9f9;
  text-decoration:none;
  display:block;
  cursor:pointer;
  padding-bottom:30px;
}
.product-img{
  position:relative;
  width:100%;
  padding-top:125%;
  background:#f9f9f9;
  overflow:hidden;
}
.product-img img{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  object-fit:cover;
  object-position:center 30%;
  transition:opacity .3s ease;
}
.product-img .img2{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  opacity:0;
  transition:opacity .35s ease;
}
.product-img .img2 img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.product-card:hover .img2{opacity:1}
.product-placeholder{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-family:var(--serif);
  font-size:22px;
  font-weight:300;
  font-style:italic;
  color:#ccc;
  user-select:none;
}
.product-info{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  padding:10px 0 0;
  gap:8px;
}
.product-name{font-size:0.8rem;font-weight:normal;letter-spacing:.01em;color:var(--black);line-height:1.45;font-family:'DINNext',Arial,sans-serif}
.product-price{font-size:0.8rem;font-weight:normal;color:var(--black);white-space:nowrap;flex-shrink:0;font-family:'DINNext',Arial,sans-serif}

/* EMPTY */
.empty-state{display:none;padding:80px 24px;text-align:center}
.empty-state.show{display:block}
.empty-state p{font-size:14px;color:var(--gray-mid);margin-bottom:16px}
.empty-state a{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--black);text-decoration:none;border-bottom:1px solid var(--black)}

/* VIEW MORE */
.pagination{display:flex;align-items:center;justify-content:center;padding:48px 24px}
.view-more-btn{font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;background:none;border:1px solid var(--black);color:var(--black);padding:14px 48px;cursor:pointer;transition:background .2s,color .2s}
.view-more-btn:hover{background:var(--black);color:var(--white)}

/* REFINE PANEL */
.refine-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:none;opacity:0;pointer-events:none;transition:opacity .25s}
.refine-overlay.open{display:block;opacity:1;pointer-events:all}
.refine-panel{
  position:fixed;top:0;right:0;bottom:0;
  width:300px;background:var(--white);
  z-index:201;
  transform:translateX(100%);
  transition:transform .3s ease;
  overflow-y:auto;
  padding:24px;
}
.refine-panel.open{transform:translateX(0)}
.refine-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
.refine-title{font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.refine-close{background:none;border:none;cursor:pointer;font-size:20px;color:var(--black);line-height:1}
.filter-sec{border-top:1px solid var(--gray-border);padding:20px 0}
.filter-sec-title{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px;color:var(--black)}
.filter-opts{display:flex;flex-direction:column;gap:10px}
.filter-opt{display:flex;align-items:center;gap:10px;cursor:pointer}
.filter-opt input{appearance:none;width:13px;height:13px;border:1px solid var(--gray-mid);flex-shrink:0;cursor:pointer;transition:background .15s,border-color .15s;position:relative}
.filter-opt input:checked{background:var(--black);border-color:var(--black)}
.filter-opt input:checked::after{content:'';position:absolute;top:1px;left:4px;width:3px;height:6px;border:1.5px solid #fff;border-left:none;border-top:none;transform:rotate(45deg)}
.filter-opt span{font-size:12px;font-weight:300;color:var(--black);letter-spacing:.02em}
.price-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.price-input{border:1px solid var(--gray-border);padding:8px 10px;font-size:12px;font-family:var(--sans);color:var(--black);width:100%;outline:none;background:none;transition:border-color .2s}
.price-input:focus{border-color:var(--black)}
.price-input::placeholder{color:var(--gray-mid)}
.refine-apply{width:100%;margin-top:28px;padding:13px;background:var(--black);color:var(--white);border:none;font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;font-family:var(--sans);cursor:pointer;transition:opacity .2s}
.refine-apply:hover{opacity:.8}
.refine-clear{width:100%;margin-top:8px;padding:13px;background:none;color:var(--black);border:1px solid var(--gray-border);font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;font-family:var(--sans);cursor:pointer;transition:border-color .2s}
.refine-clear:hover{border-color:var(--black)}

/* SORT PANEL */
.sort-panel{
  position:fixed;top:100px;right:24px;
  background:var(--white);
  border:1px solid var(--gray-border);
  z-index:150;
  display:none;
  min-width:220px;
}
.sort-panel.open{display:block}
.sort-option{display:block;width:100%;padding:12px 16px;font-size:12px;font-family:var(--sans);color:var(--black);background:none;border:none;text-align:left;cursor:pointer;transition:background .15s}
.sort-option:hover{background:var(--gray-bg)}
.sort-option.active{font-weight:500}

@media(max-width:1024px){.product-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){
  nav{padding:0 16px}
  .toolbar{padding:0 16px}
  .product-grid{grid-template-columns:repeat(2,1fr)}
  .refine-panel{width:100%}
}
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <button class="nav-hamburger" aria-label="Menü">
      <span></span><span></span>
    </button>
  </div>
  <a href="index.html" class="nav-logo">
    <img src="siyah.png" alt="Aurel Valmont" style="height:40px;width:auto;display:block;">
    <span class="nav-brand">Aurel Valmont</span>
  </a>
  <div class="nav-right">
    <button class="nav-icon" aria-label="Hesap">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
    <button class="nav-icon" aria-label="Arama">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
    </button>
    <button class="nav-icon" aria-label="Sepet">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    </button>
    <button class="nav-menu" aria-label="Menü">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="0" y1="1" x2="18" y2="1"/>
        <line x1="0" y1="7" x2="18" y2="7"/>
        <line x1="0" y1="13" x2="18" y2="13"/>
      </svg>
      Menü
    </button>
  </div>
</nav>

<div class="toolbar">
  <div class="toolbar-left">
    <button class="toolbar-cat active" data-kat="">Tümü</button>
    <button class="toolbar-cat" data-kat="kadin">Kadın</button>
    <button class="toolbar-cat" data-kat="erkek">Erkek</button>
    <button class="toolbar-cat" data-kat="unisex">Unisex</button>
    <span class="cat-label" id="cat-label"></span>
  </div>
  <div class="toolbar-right">
    <button class="sort-btn" id="sort-btn">
      Sırala: <span id="sort-label">Önerilen</span>
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3.5 5 6.5 8 3.5"/></svg>
    </button>
    <div class="toolbar-sep"></div>
    <button class="refine-btn" id="refine-btn">Filtrele</button>
  </div>
</div>

<div class="product-grid" id="grid"></div>
<div class="empty-state" id="empty">
  <p>Bu kategoride ürün bulunamadı.</p>
  <a href="koleksiyon.html">Tümünü gör</a>
</div>
<div class="pagination" id="pag"></div>

<!-- SORT PANEL -->
<div class="sort-panel" id="sort-panel">
  <button class="sort-option active" data-sort="default">Önerilen</button>
  <button class="sort-option" data-sort="new">Yeni Gelenler</button>
  <button class="sort-option" data-sort="price-asc">Fiyat: Düşükten Yükseğe</button>
  <button class="sort-option" data-sort="price-desc">Fiyat: Yükseğen Düşüğe</button>
</div>

<!-- REFINE PANEL -->
<div class="refine-overlay" id="overlay"></div>
<div class="refine-panel" id="refine-panel">
  <div class="refine-header">
    <span class="refine-title">Filtrele</span>
    <button class="refine-close" id="refine-close">×</button>
  </div>
  <div class="filter-sec">
    <p class="filter-sec-title">Cinsiyet</p>
    <div class="filter-opts">
      <label class="filter-opt"><input type="checkbox" data-filter="cinsiyet" value="Kadın"><span>Kadın</span></label>
      <label class="filter-opt"><input type="checkbox" data-filter="cinsiyet" value="Erkek"><span>Erkek</span></label>
      <label class="filter-opt"><input type="checkbox" data-filter="cinsiyet" value="Unisex"><span>Unisex</span></label>
    </div>
  </div>
  <div class="filter-sec">
    <p class="filter-sec-title">Çerçeve Formu</p>
    <div class="filter-opts">
      <label class="filter-opt"><input type="checkbox" data-filter="cerceve" value="Oval"><span>Oval</span></label>
      <label class="filter-opt"><input type="checkbox" data-filter="cerceve" value="Kare"><span>Kare</span></label>
      <label class="filter-opt"><input type="checkbox" data-filter="cerceve" value="Dikdörtgen"><span>Dikdörtgen</span></label>
      <label class="filter-opt"><input type="checkbox" data-filter="cerceve" value="Yuvarlak"><span>Yuvarlak</span></label>
    </div>
  </div>
  <div class="filter-sec">
    <p class="filter-sec-title">Fiyat</p>
    <div class="price-row">
      <input type="number" class="price-input" id="pmin" placeholder="Min ₺">
      <input type="number" class="price-input" id="pmax" placeholder="Max ₺">
    </div>
  </div>
  <button class="refine-apply" id="refine-apply">Uygula</button>
  <button class="refine-clear" id="refine-clear">Filtreleri Temizle</button>
</div>

<script>
const PER = 40;
let shown = PER, sort = 'default', filtered = [], activeKat = '';
let products = [];

async function loadProducts() {
  try {
    const r = await fetch('products.json');
    products = await r.json();
  } catch(e) {
    products = SAMPLE;
  }
  init();
}

const SAMPLE = Array.from({length:40}, (_,i) => ({
  id: i+1,
  baslik: ['AV-2049 Oval Güneş Gözlüğü','AV-3012 Kare Çerçeve','AV-1087 Geometrik Form','AV-4521 Dikdörtgen','AV-0832 Yuvarlak Kemik','AV-5501 Metal Oval','AV-7720 Aviator','AV-6613 Cat-Eye','AV-2230 Unisex Oval','AV-4408 Dikdörtgen Altın'][i%10],
  fiyat_tl: [999,1099,1199,1299,1399,1499,1649,1799,899,1049][i%10],
  cinsiyet: ['Kadın','Erkek','Unisex','Kadın','Unisex','Kadın','Erkek','Kadın','Unisex','Erkek'][i%10],
  cerceve: ['Oval','Kare','Geometrik','Dikdörtgen','Yuvarlak','Oval','Dikdörtgen','Geometrik','Oval','Dikdörtgen'][i%10],
  gorseller: []
}));

function getFilters() {
  return {
    cinsiyet: [...document.querySelectorAll('[data-filter="cinsiyet"]:checked')].map(e=>e.value),
    cerceve: [...document.querySelectorAll('[data-filter="cerceve"]:checked')].map(e=>e.value),
    pmin: parseFloat(document.getElementById('pmin').value)||0,
    pmax: parseFloat(document.getElementById('pmax').value)||Infinity,
  };
}

function filter() {
  const f = getFilters();
  filtered = products.filter(p => {
    if (activeKat === 'kadin' && p.cinsiyet !== 'Kadın') return false;
    if (activeKat === 'erkek' && p.cinsiyet !== 'Erkek') return false;
    if (activeKat === 'unisex' && p.cinsiyet !== 'Unisex') return false;
    if (f.cinsiyet.length && !f.cinsiyet.includes(p.cinsiyet)) return false;
    if (f.cerceve && f.cerceve.length && !f.cerceve.includes(p.cerceve)) return false;
    if (p.fiyat_tl < f.pmin || p.fiyat_tl > f.pmax) return false;
    return true;
  });
  if (sort==='price-asc') filtered.sort((a,b)=>a.fiyat_tl-b.fiyat_tl);
  else if (sort==='price-desc') filtered.sort((a,b)=>b.fiyat_tl-a.fiyat_tl);
  shown = PER;
  render();
}

function render() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const pag = document.getElementById('pag');

  if (!filtered.length) {
    grid.innerHTML=''; empty.classList.add('show'); pag.innerHTML=''; return;
  }
  empty.classList.remove('show');

  const slice = filtered.slice(0, shown);
  grid.innerHTML = slice.map(p => {
    const img1 = p.gorseller && p.gorseller[0];
    const img2 = p.gorseller && p.gorseller[1];
    const imgTag = img1
      ? `<img src="${img1}" alt="${p.baslik}" loading="lazy">`
      : `<span class="product-placeholder">AV</span>`;
    const img2Tag = img2
      ? `<div class="img2"><img src="${img2}" alt="${p.baslik}" loading="lazy"></div>` : '';
    const modelNo = (p.baslik.match(/AV-\d+/) || [p.stok_kodu || p.baslik])[0];
    return `<a class="product-card" href="urun.html?id=${p.id}">
      <div class="product-img">${imgTag}${img2Tag}</div>
      <div class="product-info">
        <span class="product-name">${modelNo}</span>
        <span class="product-price">₺${p.fiyat_tl.toLocaleString('tr-TR')}</span>
      </div>
    </a>`;
  }).join('');

  if (shown < filtered.length) {
    pag.innerHTML = `<button class="view-more-btn" onclick="loadMore()">DAHA FAZLA GÖSTER</button>`;
  } else {
    pag.innerHTML = '';
  }
}

function loadMore() {
  shown += PER;
  render();
}

function setKat(kat) {
  activeKat = kat;
  document.querySelectorAll('.toolbar-cat').forEach(b => {
    b.classList.toggle('active', b.dataset.kat === kat);
  });
  filter();
}

function init() {
  const urlKat = new URLSearchParams(location.search).get('kategori') || '';
  activeKat = urlKat;
  document.querySelectorAll('.toolbar-cat').forEach(b => {
    b.classList.toggle('active', b.dataset.kat === urlKat);
    b.addEventListener('click', () => setKat(b.dataset.kat));
  });
  filter();
}

// SORT
document.getElementById('sort-btn').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('sort-panel').classList.toggle('open');
});
document.querySelectorAll('.sort-option').forEach(btn => {
  btn.addEventListener('click', () => {
    sort = btn.dataset.sort;
    document.getElementById('sort-label').textContent = btn.textContent;
    document.querySelectorAll('.sort-option').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('sort-panel').classList.remove('open');
    filter();
  });
});

// REFINE
document.getElementById('refine-btn').addEventListener('click', () => {
  document.getElementById('refine-panel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
});
function closeRefine() {
  document.getElementById('refine-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}
document.getElementById('refine-close').addEventListener('click', closeRefine);
document.getElementById('overlay').addEventListener('click', closeRefine);
document.getElementById('refine-apply').addEventListener('click', () => { closeRefine(); filter(); });
document.getElementById('refine-clear').addEventListener('click', () => {
  document.querySelectorAll('[data-filter]').forEach(e=>e.checked=false);
  document.getElementById('pmin').value='';
  document.getElementById('pmax').value='';
  closeRefine(); filter();
});

window.addEventListener('scroll', () => {
  document.querySelector('nav').classList.toggle('scrolled', window.scrollY > 40);
}, { passive: true });

document.addEventListener('click', e => {
  if (!e.target.closest('#sort-btn') && !e.target.closest('#sort-panel'))
    document.getElementById('sort-panel').classList.remove('open');
});

loadProducts();
</script>
</body>
</html>
